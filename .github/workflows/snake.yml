# Redraws the contribution graph in brand colors with a snake, once a day.
# Output goes to the "output" branch, which README.md reads from.
name: Contribution snake

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            dist/github-snake.svg?color_snake=#0d0d0d&color_dots=#ebe5df,#ffd2c2,#ffa585,#ff7f55,#e5531f
            dist/github-snake-dark.svg?color_snake=#fcf7f3&color_dots=#1c1b1a,#4a2418,#8a3a20,#c95230,#ff6a3a

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
